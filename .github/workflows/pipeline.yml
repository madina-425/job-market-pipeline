# .github/workflows/pipeline.yml
# Runs the ETL pipeline every day at 06:00 UTC.
# Also triggered manually via workflow_dispatch.

name: Daily ETL Pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 12:00 Almaty time
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME:        ${{ secrets.S3_BUCKET_NAME }}
          DB_HOST:               ${{ secrets.DB_HOST }}
          DB_PORT:               ${{ secrets.DB_PORT }}
          DB_NAME:               ${{ secrets.DB_NAME }}
          DB_USER:               ${{ secrets.DB_USER }}
          DB_PASSWORD:           ${{ secrets.DB_PASSWORD }}
          HH_USER_AGENT:         ${{ secrets.HH_USER_AGENT }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          LOG_LEVEL:             INFO
          PIPELINE_ENV:          prod
        run: python -m pipelines.etl_pipeline

      - name: Upload logs as artifact
        if: always()   # upload even on failure for debugging
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/pipeline.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline FAILED — check logs artifact above"
          # Add Slack/email notification here if desired
