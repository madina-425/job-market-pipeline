# Runs on push/PR to main and develop (Python pipeline only — web/ is ignored).
# Checks: ruff linting, pytest, Docker build.

name: CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu:24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check src/ pipelines/ configs/ tests/ --select F

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOG_LEVEL: WARNING
          PIPELINE_ENV: development
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: eu-west-1
          S3_BUCKET_NAME: test-bucket
          DB_HOST: localhost
          DB_USER: test
          DB_PASSWORD: test
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  docker-build:
    name: Docker build check
    runs-on: ubuntu:24.04
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t jobmarket-pipeline:ci .

      - name: Verify image
        run: docker run --rm jobmarket-pipeline:ci python -c "import pandas, boto3, sqlalchemy; print('imports OK')"
