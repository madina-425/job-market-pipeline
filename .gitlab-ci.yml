stages:
    - test
    - build

image: python:3.12-slim

cache:
    paths: 
        - .cache/pip/

variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PYTHONPATH: "$CI_PROJECT_DIR"

test:
    stage: test
    before_script:
        - pip install -r requirements.txt
    script:
        - pytest --cov=. --cov-report=xml
    coverage: '/TOTAL.*\s+(\d+%)$/'
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
