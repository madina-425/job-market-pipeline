# Daily ETL run (06:00 UTC) and manual trigger from the Actions tab.

name: Daily ETL Pipeline

on:
  push:
      branches: [develop]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: etl-pipeline
  cancel-in-progress: false

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME || 'jobmarket' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HH_USER_AGENT: ${{ secrets.HH_USER_AGENT }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          LOG_LEVEL: INFO
          PIPELINE_ENV: production
        run: python -m pipelines.etl_pipeline

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/pipeline.log
          retention-days: 30
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: echo "Pipeline FAILED — check the pipeline-logs artifact for details."
